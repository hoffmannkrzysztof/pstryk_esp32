name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PlatformIO and signing deps
        run: pip install --upgrade platformio cryptography

      - name: Derive and validate version
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # Hard gate. The tag goes verbatim into FIRMWARE_VERSION and into the
          # manifest, and there is no recovery path from a bad one: a tag containing
          # "-dev" used to disable self-update permanently on every device that
          # installed it, and a "-rc1" tag makes the matching final release look
          # not-newer, stranding the fleet on the prerelease.
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH with no suffix, got '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Inject firmware version
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: printf '#define FIRMWARE_VERSION "%s"\n' "$VER" > src/core/FirmwareVersionGen.h

      - name: Build both boards
        run: |
          pio run -e t5_epaper_s3
          pio run -e tdisplay_long

      - name: Restore signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: printf '%s' "$OTA_SIGNING_KEY" > private_key.pem

      # The signature is the ONLY trust anchor for OTA on both boards, so verify
      # against the public key that is actually COMPILED INTO the firmware, not one
      # re-extracted from the private key we just signed with. The latter check was
      # circular: it passed even if the embedded key and the signing key had drifted
      # apart -- the one failure that bricks OTA for every device in the field.
      - name: Reconstruct the firmware's embedded public key
        run: python tools/extract_embedded_pubkey.py --out embedded_public_key.pem

      - name: Sign, verify, and write manifests
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          sign_board () {
            env="$1"; board="$2"
            python tools/bin_signing.py --bin ".pio/build/$env/firmware.bin" --key private_key.pem --out "firmware-$board.bin"
            python tools/bin_signing.py --verify "firmware-$board.bin" --pubkey embedded_public_key.pem
            size=$(stat -c%s "firmware-$board.bin")
            sha=$(sha256sum "firmware-$board.bin" | cut -d' ' -f1)
            # The URL is built from v$VER, not $TAG: OtaUpdater rebuilds this exact
            # string from the manifest's own board+version and refuses anything else,
            # which is what binds a claimed version to a real artifact (and stops a
            # MITM pointing a "99.0.0" manifest at an old signed binary). The tag
            # gate above guarantees $TAG == v$VER, so this is the same value stated
            # in the form the firmware can reconstruct.
            printf '{"board":"%s","version":"%s","url":"https://github.com/%s/releases/download/v%s/firmware-%s.bin","size":%s,"sha256":"%s"}\n' \
              "$board" "$VER" "$REPO" "$VER" "$board" "$size" "$sha" > "manifest-$board.json"
          }
          sign_board t5_epaper_s3 epaper
          sign_board tdisplay_long amoled

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-epaper.bin
            firmware-amoled.bin
            manifest-epaper.json
            manifest-amoled.json

      - name: Scrub key material
        if: always()
        run: rm -f private_key.pem embedded_public_key.pem
